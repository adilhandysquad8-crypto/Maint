<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Handy Squad — Job Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* ── RESET ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',system-ui,sans-serif;background:#F0F4F8;color:#1E293B}
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

/* ── CSS VARS ── */
:root{
  --blue-50:#EFF6FF;--blue-100:#DBEAFE;--blue-200:#BFDBFE;
  --blue-500:#3B82F6;--blue-600:#2563EB;--blue-700:#1D4ED8;
  --blue-800:#1E40AF;--blue-900:#1E3A8A;
  --slate-50:#F8FAFC;--slate-100:#F1F5F9;--slate-200:#E2E8F0;
  --slate-400:#94A3B8;--slate-500:#64748B;--slate-600:#475569;
  --slate-700:#334155;--slate-800:#1E293B;--slate-900:#0F172A;
  --green-50:#F0FDF4;--green-500:#22C55E;--green-600:#16A34A;--green-700:#15803D;
  --amber-50:#FFFBEB;--amber-500:#F59E0B;--amber-600:#D97706;
  --red-50:#FEF2F2;--red-400:#F87171;--red-500:#EF4444;--red-600:#DC2626;
  --purple-50:#FAF5FF;--purple-500:#A855F7;--purple-600:#9333EA;
  --shadow-sm:0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
  --shadow-lg:0 12px 32px rgba(0,0,0,.12);
  --radius:10px;--radius-lg:16px;
}

/* ── LOADING ── */
#loading-overlay{position:fixed;inset:0;background:#1E40AF;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px}
.loader-logo{font-size:28px;font-weight:700;color:#fff;letter-spacing:-1px}
.loader-sub{font-size:13px;color:#93C5FD}
.loader-ring{width:40px;height:40px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── AUTH SCREEN ── */
#auth-screen{display:none;position:fixed;inset:0;background:linear-gradient(135deg,#1E3A8A 0%,#1E40AF 50%,#2563EB 100%);align-items:center;justify-content:center;z-index:100}
.auth-card{background:#fff;border-radius:20px;padding:40px;width:360px;box-shadow:var(--shadow-lg)}
.auth-logo{text-align:center;margin-bottom:28px}
.auth-logo-text{font-size:24px;font-weight:700;color:var(--blue-700);letter-spacing:-1px}
.auth-logo-sub{font-size:12px;color:var(--slate-400);margin-top:2px}
.auth-label{font-size:12px;font-weight:600;color:var(--slate-600);margin-bottom:5px;display:block}
.auth-input{width:100%;padding:10px 14px;border:1.5px solid var(--slate-200);border-radius:8px;font-size:14px;outline:none;transition:border-color .2s;margin-bottom:14px}
.auth-input:focus{border-color:var(--blue-500)}
.auth-btn{width:100%;padding:12px;background:var(--blue-600);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s}
.auth-btn:hover{background:var(--blue-700)}
.auth-btn:disabled{opacity:.6;cursor:not-allowed}
#auth-error{background:var(--red-50);color:var(--red-600);padding:10px 12px;border-radius:8px;font-size:13px;display:none;margin-bottom:14px}

/* ── APP SHELL ── */
#app{display:none;height:100vh;overflow:hidden}
#app.visible{display:flex}
.sidebar{width:240px;height:100vh;background:#fff;border-right:1px solid var(--slate-200);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;transition:transform .3s}
.sb-header{padding:20px 16px 14px;border-bottom:1px solid var(--slate-100)}
.sb-logo{font-size:18px;font-weight:700;color:var(--blue-700);letter-spacing:-0.5px}
.sb-user{display:flex;align-items:center;gap:10px;margin-top:12px}
.sb-avatar{width:34px;height:34px;border-radius:50%;background:var(--blue-600);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.sb-name{font-size:13px;font-weight:600;color:var(--slate-700)}
.sb-role{font-size:11px;color:var(--slate-400);text-transform:capitalize}
#sidebar-nav{padding:12px 10px;flex:1}
.nav-section{font-size:10px;font-weight:700;color:var(--slate-400);letter-spacing:.8px;text-transform:uppercase;padding:10px 6px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--slate-600);transition:all .15s;margin-bottom:1px}
.nav-item:hover{background:var(--blue-50);color:var(--blue-700)}
.nav-item.active{background:var(--blue-600);color:#fff}
.nav-item.active .nav-badge{background:rgba(255,255,255,.25);color:#fff}
.nav-icon{font-size:14px;width:18px;text-align:center}
.nav-badge{margin-left:auto;background:var(--red-500);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px}
.nav-badge.warn{background:var(--amber-500)}
.sb-footer{padding:12px 16px;border-top:1px solid var(--slate-100)}
.logout-btn{width:100%;padding:9px;border:1.5px solid var(--slate-200);background:#fff;border-radius:8px;font-size:13px;font-weight:500;color:var(--slate-600);cursor:pointer;transition:all .2s}
.logout-btn:hover{border-color:var(--red-400);color:var(--red-500)}

/* ── MAIN CONTENT ── */
.main-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;background:#fff;border-bottom:1px solid var(--slate-200);display:flex;align-items:center;gap:12px;padding:0 20px;flex-shrink:0}
.topbar-title{font-size:16px;font-weight:700;color:var(--slate-800);flex:1}
.topbar-role{font-size:12px;color:var(--slate-400);background:var(--slate-100);padding:3px 10px;border-radius:20px}
#hamburger{display:none;background:none;border:none;font-size:20px;cursor:pointer;color:var(--slate-600)}
#page-content{flex:1;overflow-y:auto;padding:20px}

/* ── CARDS ── */
.card{background:#fff;border-radius:var(--radius-lg);border:1px solid var(--slate-200);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:16px}
.card-header{padding:16px 20px;border-bottom:1px solid var(--slate-100);display:flex;align-items:center;gap:10px}
.card-title{font-size:14px;font-weight:700;color:var(--slate-800);flex:1}
.card-body{padding:16px 20px}
.card-actions{display:flex;gap:8px;align-items:center}

/* ── STAT CARDS ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:var(--radius-lg);border:1px solid var(--slate-200);padding:16px;position:relative;overflow:hidden}
.stat-accent{position:absolute;top:0;left:0;right:0;height:3px}
.stat-label{font-size:11px;font-weight:600;color:var(--slate-400);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.stat-value{font-size:24px;font-weight:700;color:var(--slate-800);line-height:1}
.stat-sub{font-size:11px;color:var(--slate-400);margin-top:4px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--blue-600);color:#fff}.btn-primary:hover{background:var(--blue-700)}
.btn-secondary{background:var(--slate-100);color:var(--slate-700);border:1px solid var(--slate-200)}.btn-secondary:hover{background:var(--slate-200)}
.btn-success{background:var(--green-600);color:#fff}.btn-success:hover{background:var(--green-700)}
.btn-danger{background:var(--red-500);color:#fff}.btn-danger:hover{background:var(--red-600)}
.btn-ghost{background:transparent;color:var(--slate-600);border:1px solid var(--slate-200)}.btn-ghost:hover{background:var(--slate-50)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ── FORM ── */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--slate-600);margin-bottom:5px}
.form-input,.form-select,.form-textarea{width:100%;padding:9px 12px;border:1.5px solid var(--slate-200);border-radius:8px;font-size:13px;outline:none;transition:border-color .2s;background:#fff;font-family:inherit}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--blue-500)}
.form-textarea{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:16px;border-top:1px solid var(--slate-100)}
.form-hint{font-size:11px;color:var(--slate-400);margin-top:3px}

/* ── TABLE ── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:700;color:var(--slate-500);text-transform:uppercase;letter-spacing:.5px;padding:10px 14px;border-bottom:1px solid var(--slate-200);text-align:left;background:var(--slate-50)}
td{padding:11px 14px;font-size:13px;border-bottom:1px solid var(--slate-100);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--slate-50)}

/* ── STATUS BADGES ── */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-active{background:var(--green-50);color:var(--green-700)}
.badge-completed{background:var(--purple-50);color:var(--purple-600)}
.badge-delayed{background:var(--red-50);color:var(--red-600)}
.badge-rework{background:var(--amber-50);color:var(--amber-600)}
.badge-pending{background:var(--slate-100);color:var(--slate-600)}

/* ── JOB ITEM ── */
.job-row{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--slate-100);cursor:pointer;transition:background .15s}
.job-row:last-child{border-bottom:none}
.job-row:hover{background:var(--blue-50)}
.job-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.job-info{flex:1;min-width:0}
.job-name{font-size:14px;font-weight:600;color:var(--slate-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job-meta{font-size:12px;color:var(--slate-400);margin-top:2px}
.job-amount{font-size:13px;font-weight:700;color:var(--blue-700);white-space:nowrap}

/* ── PROGRESS BAR ── */
.progress{height:5px;background:var(--slate-200);border-radius:3px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:3px;transition:width .3s}

/* ── MODAL ── */
#modal-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:500;align-items:center;justify-content:center;padding:16px}
#modal-backdrop.open{display:flex}
.modal{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-header{padding:18px 20px;border-bottom:1px solid var(--slate-100);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:2}
.modal-title{font-size:16px;font-weight:700;color:var(--slate-800)}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--slate-400);line-height:1;padding:4px}
.modal-body{padding:20px}

/* ── TOAST ── */
#toast-container{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:9000}
.toast{padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow-md);display:flex;align-items:center;gap:8px;min-width:220px;animation:slideIn .3s ease}
.toast.success{background:var(--green-600);color:#fff}
.toast.error{background:var(--red-500);color:#fff}
.toast.info{background:var(--blue-600);color:#fff}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* ── FINANCE SUMMARY ── */
.finance-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.fin-item{background:var(--slate-50);border-radius:10px;padding:12px;border:1px solid var(--slate-200)}
.fin-label{font-size:10px;font-weight:700;color:var(--slate-400);text-transform:uppercase;letter-spacing:.5px}
.fin-val{font-size:18px;font-weight:700;color:var(--slate-800);margin-top:2px}
.fin-val.green{color:var(--green-600)}
.fin-val.red{color:var(--red-500)}
.fin-sub{font-size:11px;color:var(--slate-400);margin-top:2px}

/* ── DAILY REPORT ITEM ── */
.report-item{padding:14px 20px;border-bottom:1px solid var(--slate-100)}
.report-item:last-child{border-bottom:none}
.report-date{font-size:12px;font-weight:700;color:var(--blue-600);margin-bottom:4px}
.report-work{font-size:13px;color:var(--slate-700);margin-bottom:8px}
.report-costs{display:flex;gap:16px;flex-wrap:wrap}
.cost-pill{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 8px;background:var(--slate-100);border-radius:20px;color:var(--slate-600)}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:40px 20px}
.empty-icon{font-size:32px;margin-bottom:8px;opacity:.4}
.empty-text{font-size:14px;color:var(--slate-400)}
.empty-hint{font-size:12px;color:var(--slate-300);margin-top:4px}

/* ── IMAGE GRID ── */
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.img-thumb{aspect-ratio:1;border-radius:8px;object-fit:cover;width:100%;border:1px solid var(--slate-200);cursor:pointer;transition:transform .15s}
.img-thumb:hover{transform:scale(1.03)}
.img-add{aspect-ratio:1;border-radius:8px;border:2px dashed var(--slate-300);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:4px;color:var(--slate-400);font-size:12px;transition:all .2s}
.img-add:hover{border-color:var(--blue-400);color:var(--blue-500)}

/* ── FILTER BAR ── */
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.filter-input{flex:1;min-width:140px;padding:8px 12px;border:1.5px solid var(--slate-200);border-radius:8px;font-size:13px;outline:none;transition:border-color .2s}
.filter-input:focus{border-color:var(--blue-500)}
.filter-select{padding:8px 10px;border:1.5px solid var(--slate-200);border-radius:8px;font-size:13px;background:#fff;outline:none}
.filter-select:focus{border-color:var(--blue-500)}

/* ── SECTION DIVIDER ── */
.section-divider{font-size:11px;font-weight:700;color:var(--slate-400);letter-spacing:.6px;text-transform:uppercase;padding:10px 0 6px;margin-top:4px}

/* ── MOBILE ── */
#mob-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50}
#mob-overlay.open{display:block}
@media(max-width:768px){
  #hamburger{display:block}
  .sidebar{position:fixed;top:0;left:0;height:100vh;z-index:100;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .stats-grid{grid-template-columns:1fr 1fr}
  .finance-grid{grid-template-columns:1fr 1fr}
  .form-row{grid-template-columns:1fr}
  #page-content{padding:14px}
}

/* ── SPINNER ── */
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading-overlay">
  <div class="loader-logo">◈ Handy Squad</div>
  <div class="loader-ring"></div>
  <div class="loader-sub">Loading your workspace…</div>
</div>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-text">◈ Handy Squad</div>
      <div class="auth-logo-sub">Job Tracker — Field Management</div>
    </div>
    <div id="auth-error"></div>
    <label class="auth-label">Email</label>
    <input class="auth-input" type="email" id="login-email" placeholder="you@handysquad.com" autocomplete="email"/>
    <label class="auth-label">Password</label>
    <input class="auth-input" type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"/>
    <button class="auth-btn" id="login-btn" onclick="handleLogin()">
      <span id="login-btn-text">Sign In</span>
    </button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="sidebar" id="sidebar">
    <div class="sb-header">
      <div class="sb-logo">◈ Handy Squad</div>
      <div class="sb-user">
        <div class="sb-avatar" id="sb-avatar">HS</div>
        <div>
          <div class="sb-name" id="sb-name">User</div>
          <div class="sb-role" id="sb-role">role</div>
        </div>
      </div>
    </div>
    <div id="sidebar-nav"></div>
    <div class="sb-footer">
      <button class="logout-btn" onclick="handleLogout()">Sign Out</button>
    </div>
  </div>

  <div id="mob-overlay" onclick="closeSidebar()"></div>

  <div class="main-wrap">
    <div class="topbar">
      <button id="hamburger" onclick="toggleSidebar()">☰</button>
      <div class="topbar-title" id="topbar-title">Dashboard</div>
      <span class="topbar-role" id="topbar-role">role</span>
    </div>
    <div id="page-content"></div>
  </div>
</div>

<!-- MODAL -->
<div id="modal-backdrop" onclick="handleBackdropClick(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Title</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div id="toast-container"></div>

<!-- ── CORE ── -->
<script>
// ─── CONFIG ───────────────────────────────────────────────────────
const SUPABASE_URL  = 'https://voadiwjqirypdkmidete.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvYWRpd2pxaXJ5cGRrbWlkZXRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1Njg1OTIsImV4cCI6MjA5NDE0NDU5Mn0.qp8GOBVDcwcAWsuVfbEUBNzEoPAis17Becv6Vn3Aqx0';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ─── STATE ────────────────────────────────────────────────────────
let STATE = {
  user: null, profile: null, role: null,
  currentPage: 'dashboard',
  data: {
    jobs: [], financials: [], dailyPlans: [],
    dailyReports: [], jobImages: [], allUsers: []
  }
};

let FILTERS = {};

// ─── UTILS ───────────────────────────────────────────────────────
function esc(s){ if(s===null||s===undefined)return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;'); }
function fmt(n){ if(!n&&n!==0)return '0'; if(n>=10000000)return (n/10000000).toFixed(1)+'Cr'; if(n>=100000)return (n/100000).toFixed(1)+'L'; if(n>=1000)return (n/1000).toFixed(1)+'K'; return Math.round(n).toLocaleString('en-IN'); }
function fmtFull(n){ return n?Number(n).toLocaleString('en-IN','₹'):'0'; }
function fmtDate(d){ if(!d)return '—'; return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'}); }
function fmtDateTime(d){ if(!d)return '—'; return new Date(d).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function statusColor(s){ const m={active:'#22C55E',completed:'#A855F7',delayed:'#EF4444',rework:'#F59E0B'}; return m[s]||'#94A3B8'; }
function statusClass(s){ const m={active:'badge-active',completed:'badge-completed',delayed:'badge-delayed',rework:'badge-rework'}; return m[s]||'badge-pending'; }

function showToast(msg,type='info'){
  const tc=document.getElementById('toast-container');
  const t=document.createElement('div');
  t.className=`toast ${type}`;
  const icon=type==='success'?'✓':type==='error'?'✕':'ℹ';
  t.innerHTML=`<span>${icon}</span>${msg}`;
  tc.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(20px)';t.style.transition='all .3s';setTimeout(()=>t.remove(),300);},3200);
}

function openModal(title,html){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=html;
  document.getElementById('modal-backdrop').classList.add('open');
}
function closeModal(){ document.getElementById('modal-backdrop').classList.remove('open'); }
function handleBackdropClick(e){ if(e.target===document.getElementById('modal-backdrop'))closeModal(); }

// ─── BOOT ─────────────────────────────────────────────────────────
async function boot(){
  const t=setTimeout(()=>{hideLoading();showAuthScreen();},6000);
  try{
    const {data:{session},error}=await sb.auth.getSession();
    clearTimeout(t);
    if(error||!session){await sb.auth.signOut();showAuthScreen();}
    else{STATE.user=session.user;await loadProfile();showApp();}
  }catch(e){clearTimeout(t);await sb.auth.signOut();showAuthScreen();}
  hideLoading();
}
window.addEventListener('DOMContentLoaded',boot);

sb.auth.onAuthStateChange(async(ev,session)=>{
  if(ev==='SIGNED_OUT'){STATE.user=null;STATE.profile=null;STATE.role=null;showAuthScreen();}
});

function hideLoading(){document.getElementById('loading-overlay').style.display='none';}
function showAuthScreen(){document.getElementById('auth-screen').style.display='flex';document.getElementById('app').classList.remove('visible');}
function showApp(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app').classList.add('visible');
  buildSidebar();renderPage('dashboard');loadAllData();
}

async function loadProfile() {
  const { data } = await sb.from('users').select('*').eq('id', STATE.user.id).maybeSingle();
  if (data) {
    STATE.profile = data;
    STATE.role = data.role;
    return;
  }
  // First login — create the user row
  const name = STATE.user.user_metadata?.name || STATE.user.email.split('@')[0];
  const role = STATE.user.user_metadata?.role || 'scheduling';
  const { data: created } = await sb.from('users').upsert({
    id: STATE.user.id,   // auth UUID becomes the row ID
    name,
    role,
    email: STATE.user.email,
    phone: STATE.user.user_metadata?.phone || null
  }, { onConflict: 'id' }).select().single();

  STATE.profile = created || { id: STATE.user.id, name, role, email: STATE.user.email };
  STATE.role = STATE.profile.role;
}

async function handleLogin(){
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-password').value;
  const btn=document.getElementById('login-btn');
  const txt=document.getElementById('login-btn-text');
  document.getElementById('auth-error').style.display='none';
  if(!email||!pass){showAuthError('Enter email and password.');return;}
  btn.disabled=true;txt.innerHTML='<div class="spinner"></div>';
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){showAuthError(error.message);btn.disabled=false;txt.textContent='Sign In';return;}
  STATE.user=data.session.user;await loadProfile();showApp();
}
function showAuthError(m){const el=document.getElementById('auth-error');el.textContent=m;el.style.display='block';}
async function handleLogout(){await sb.auth.signOut();}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('auth-screen').style.display!=='none')handleLogin();});

// ─── DATA LOAD ────────────────────────────────────────────────────
async function loadAllData(){
  try{
    const [jobs,fins,plans,reports,images,users]=await Promise.all([
      sb.from('jobs').select('*, assigned_manager:users!assigned_manager_id(name)').order('created_at',{ascending:false}),
      sb.from('job_financials').select('*').order('created_at',{ascending:false}),
      sb.from('daily_plans').select('*').order('plan_date',{ascending:false}),
      sb.from('daily_reports').select('*').order('report_date',{ascending:false}),
      sb.from('job_images').select('*').order('created_at',{ascending:false}),
      sb.from('users').select('*').order('name',{ascending:true})
    ]);
    STATE.data.jobs=jobs.data||[];
    STATE.data.financials=fins.data||[];
    STATE.data.dailyPlans=plans.data||[];
    STATE.data.dailyReports=reports.data||[];
    STATE.data.jobImages=images.data||[];
    STATE.data.allUsers=users.data||[];
    renderPage(STATE.currentPage);
  }catch(e){console.error(e);showToast('Data load failed.','error');}
}

const PAGE_TITLES={'dashboard':'Dashboard','jobs':'Jobs','new-job':'New Job','financials':'Financials','daily-plans':'Daily Plans','daily-reports':'Daily Reports'};

function renderPage(pageId){
  STATE.currentPage=pageId;buildSidebar();
  document.getElementById('topbar-title').textContent=PAGE_TITLES[pageId]||pageId;
  const el=document.getElementById('page-content');
  const pages={
    'dashboard':renderDashboard,'jobs':renderJobs,'new-job':renderNewJob,
    'financials':renderFinancials,'daily-plans':renderDailyPlans,'daily-reports':renderDailyReports
  };
  el.innerHTML=(pages[pageId]||renderDashboard)();
  closeSidebar();
}
</script>

// ─── JOBS LIST ────────────────────────────────────────────────────
function renderJobs(){
  const isManager=STATE.role==='manager';
  let jobs=isManager?STATE.data.jobs.filter(j=>j.assigned_manager_id===STATE.profile?.id):STATE.data.jobs;
  const fk='jobs';
  if(!FILTERS[fk])FILTERS[fk]={};
  const f=FILTERS[fk];
  if(f.search){const q=f.search.toLowerCase();jobs=jobs.filter(j=>(j.customer_name||'').toLowerCase().includes(q)||(j.location_text||'').toLowerCase().includes(q));}
  if(f.status)jobs=jobs.filter(j=>j.status===f.status);

  return `
  <div class="filter-bar">
    <input class="filter-input" placeholder="Search jobs…" value="${f.search||''}" oninput="setFilter('jobs','search',this.value)"/>
    <select class="filter-select" onchange="setFilter('jobs','status',this.value)">
      <option value="">All statuses</option>
      ${['active','completed','delayed','rework'].map(s=>`<option value="${s}"${f.status===s?' selected':''}>${s}</option>`).join('')}
    </select>
    ${f.search||f.status?`<button class="btn btn-sm btn-ghost" onclick="clearFilters('jobs')">✕ Clear</button>`:''}
    ${!isManager?`<button class="btn btn-sm btn-primary" onclick="renderPage('new-job')" style="margin-left:auto">+ New Job</button>`:''}
  </div>
  <div class="card">
    ${jobs.length===0?`<div class="card-body"><div class="empty-state"><div class="empty-icon">▣</div><div class="empty-text">No jobs found</div></div></div>`
    :`<div>${jobs.map(j=>{
      const fin=STATE.data.financials.find(f=>f.job_id===j.id);

        <div class="job-dot" style="background:${statusColor(j.status)}"></div>
        <div class="job-info">
          <div class="job-name">${esc(j.customer_name||'—')}</div>
          <div class="job-meta">${esc(j.location_text||'No location')} · ${j.users?.name?`Mgr: ${esc(j.users.name)} · `:''}Started ${fmtDate(j.start_date||j.created_at)}</div>
          ${fin?`<div class="progress" style="max-width:200px"><div class="progress-fill" style="width:${calcProgress(j)}%;background:${statusColor(j.status)}"></div></div>`:''}

        <div style="text-align:right">

    </div>
    <script>
      ['fe-total','fe-mat','fe-lab','fe-other','fe-gst'].forEach(id=>document.getElementById(id)?.addEventListener('input',updateFinPreview));
      function updateFinPreview(){
        const total=parseFloat(document.getElementById('fe-total').value)||0;
        const mat=parseFloat(document.getElementById('fe-mat').value)||0;
        const lab=parseFloat(document.getElementById('fe-lab').value)||0;
        const other=parseFloat(document.getElementById('fe-other').value)||0;
        const gst=parseFloat(document.getElementById('fe-gst').value)||18;
        const netVal=total-(total*gst/100);
        const expProfit=netVal-mat-lab-other;
        document.getElementById('fe-preview').innerHTML=
          'Net after GST: <b>₹'+netVal.toLocaleString('en-IN')+'</b> &nbsp;|&nbsp; Expected Profit: <b style="color:'+
          (expProfit>=0?'var(--green-600)':'var(--red-500)')+'">₹'+expProfit.toLocaleString('en-IN')+'</b>';
      }
      updateFinPreview();
    <\/script>
  `);
}

async function saveFinancials(jobId,existingId){

  };
  let error;
  if(existingId){({error}=await sb.from('job_financials').update({...payload,updated_at:new Date().toISOString()}).eq('id',existingId));}

<!-- ── PDF GENERATION ── -->
<script>
function downloadJobPDF(jobId){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  const j=STATE.data.jobs.find(x=>x.id===jobId);
  const fin=STATE.data.financials.find(x=>x.job_id===jobId);
  const reports=STATE.data.dailyReports.filter(r=>r.job_id===jobId).sort((a,b)=>a.report_date.localeCompare(b.report_date));
  const plans=STATE.data.dailyPlans.filter(p=>p.job_id===jobId).sort((a,b)=>a.plan_date.localeCompare(b.plan_date));

  const blue=[30,64,175];const darkBlue=[15,30,86];const gray=[100,116,139];const lightGray=[248,250,252];

  // ── PAGE 1: Header
  doc.setFillColor(...darkBlue);doc.rect(0,0,210,38,'F');
  doc.setTextColor(255,255,255);doc.setFontSize(20);doc.setFont('helvetica','bold');
  doc.text('HANDY SQUAD',14,16);
  doc.setFontSize(9);doc.setFont('helvetica','normal');
  doc.text('Job Completion Report',14,24);
  doc.text('Generated: '+new Date().toLocaleDateString('en-IN'),14,30);

  doc.setTextColor(...darkBlue);doc.setFontSize(15);doc.setFont('helvetica','bold');
  doc.text(j?.customer_name||'Job Report',14,50);
  doc.setFontSize(9);doc.setFont('helvetica','normal');doc.setTextColor(...gray);
  doc.text((j?.location_text||'')+(j?.customer_phone?' · '+j.customer_phone:''),14,57);
  doc.text('Status: '+(j?.status||'—')+' · Start: '+fmtDate(j?.start_date)+(j?.completion_date?' · Completed: '+fmtDate(j.completion_date):''),14,63);

  if(j?.work_details){
    doc.setFontSize(8);doc.setTextColor(...gray);doc.text('Work Details:',14,72);
    doc.setTextColor(30,41,59);
    const lines=doc.splitTextToSize(j.work_details,182);
    doc.text(lines,14,78);
  }

  // ── Financial Summary
  let y=fin?100:90;
  if(fin){
    doc.setFillColor(...blue);doc.rect(0,90,210,8,'F');
    doc.setTextColor(255,255,255);doc.setFontSize(9);doc.setFont('helvetica','bold');
    doc.text('FINANCIAL SUMMARY',14,95.5);

    const actualSpend=(fin.material_actual||0)+(fin.labour_actual||0)+(fin.other_actual||0);
    const netValue=(fin.total_amount||0)-((fin.total_amount||0)*(fin.gst_rate||18)/100);
    const runProfit=netValue-actualSpend;

    doc.autoTable({
      startY:100,
      head:[['Item','Expected','Actual']],
      body:[
        ['Contract Value','₹'+fmt(fin.total_amount||0),'—'],
        ['GST ('+fin.gst_rate+'%)','₹'+fmt((fin.total_amount||0)*(fin.gst_rate||18)/100),'—'],
        ['Net Value','₹'+fmt(netValue),'—'],
        ['Material','₹'+fmt(fin.material_expected||0),'₹'+fmt(fin.material_actual||0)],
        ['Labour','₹'+fmt(fin.labour_expected||0),'₹'+fmt(fin.labour_actual||0)],
        ['Other','₹'+fmt(fin.other_expected||0),'₹'+fmt(fin.other_actual||0)],
        ['PROFIT','₹'+fmt(fin.expected_profit||0),'₹'+fmt(runProfit)]
      ],
      theme:'striped',
      headStyles:{fillColor:blue,fontSize:8},
      bodyStyles:{fontSize:8},
      columnStyles:{1:{halign:'right'},2:{halign:'right'}},
      rowPageBreak:'auto'
    });
    y=doc.lastAutoTable.finalY+10;
  }

  // ── Daily Plans
  if(plans.length>0){
    if(y>240){doc.addPage();y=20;}
    doc.setFillColor(...blue);doc.rect(0,y,210,8,'F');
    doc.setTextColor(255,255,255);doc.setFontSize(9);doc.setFont('helvetica','bold');
    doc.text('DAILY PLANS ('+plans.length+')',14,y+5.5);
    doc.autoTable({
      startY:y+10,
      head:[['Date','Workers','Plan']],
      body:plans.map(p=>[fmtDate(p.plan_date),p.workers||0,p.plan_text]),
      theme:'striped',
      headStyles:{fillColor:blue,fontSize:8},
      bodyStyles:{fontSize:8},
      columnStyles:{0:{cellWidth:25},1:{cellWidth:18},2:{cellWidth:147}}
    });
    y=doc.lastAutoTable.finalY+10;
  }

  // ── Daily Reports
  if(reports.length>0){
    if(y>240){doc.addPage();y=20;}
    doc.setFillColor(...blue);doc.rect(0,y,210,8,'F');
    doc.setTextColor(255,255,255);doc.setFontSize(9);doc.setFont('helvetica','bold');
    doc.text('DAILY REPORTS ('+reports.length+')',14,y+5.5);
    doc.autoTable({
      startY:y+10,
      head:[['Date','Workers','Work Done','Material','Labour','Other','Total']],
      body:reports.map(r=>[
        fmtDate(r.report_date),r.workers_present||0,r.work_done,
        '₹'+fmt(r.material_cost||0),'₹'+fmt(r.labour_cost||0),'₹'+fmt(r.other_cost||0),
        '₹'+fmt((r.material_cost||0)+(r.labour_cost||0)+(r.other_cost||0))
      ]),
      foot:[['','','TOTAL',
        '₹'+fmt(reports.reduce((s,r)=>s+(r.material_cost||0),0)),
        '₹'+fmt(reports.reduce((s,r)=>s+(r.labour_cost||0),0)),
        '₹'+fmt(reports.reduce((s,r)=>s+(r.other_cost||0),0)),
        '₹'+fmt(reports.reduce((s,r)=>s+(r.material_cost||0)+(r.labour_cost||0)+(r.other_cost||0),0))
      ]],
      theme:'striped',
      headStyles:{fillColor:blue,fontSize:7},
      footStyles:{fillColor:darkBlue,textColor:[255,255,255],fontStyle:'bold',fontSize:7},
      bodyStyles:{fontSize:7},
      columnStyles:{2:{cellWidth:60},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'},6:{halign:'right'}}
    });
  }

  // ── Footer on each page
  const pgCount=doc.internal.getNumberOfPages();
  for(let i=1;i<=pgCount;i++){
    doc.setPage(i);
    doc.setFillColor(248,250,252);doc.rect(0,285,210,12,'F');
    doc.setFontSize(7);doc.setTextColor(...gray);
    doc.text('Handy Squad · Job Tracker · Confidential',14,291);
    doc.text(`Page ${i} of ${pgCount}`,196,291,{align:'right'});
  }

  doc.save(`HSquad_${(j?.customer_name||'job').replace(/\s/g,'_')}_Report.pdf`);
  showToast('PDF downloaded!','success');
}

function downloadAdvanceForm(jobId){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF();
  const j=STATE.data.jobs.find(x=>x.id===jobId);
  const fin=STATE.data.financials.find(x=>x.job_id===jobId);

  const blue=[30,64,175];const darkBlue=[15,30,86];const gray=[100,116,139];

  // Header
  doc.setFillColor(...darkBlue);doc.rect(0,0,210,32,'F');
  doc.setTextColor(255,255,255);doc.setFontSize(18);doc.setFont('helvetica','bold');
  doc.text('ADVANCE REQUEST FORM',14,14);
  doc.setFontSize(8);doc.setFont('helvetica','normal');
  doc.text('Handy Squad — Field Management System',14,21);
  doc.text('Date: '+new Date().toLocaleDateString('en-IN'),14,27);

  // Job Info
  doc.setFillColor(239,246,255);doc.rect(0,34,210,22,'F');
  doc.setTextColor(...darkBlue);doc.setFontSize(10);doc.setFont('helvetica','bold');
  doc.text('JOB INFORMATION',14,42);
  doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(30,41,59);
  doc.text('Customer: '+(j?.customer_name||'—'),14,49);
  doc.text('Location: '+(j?.location_text||'—'),14,53);
  doc.text('Start Date: '+fmtDate(j?.start_date),100,49);
  doc.text('Status: '+(j?.status||'—'),100,53);

  let y=62;

  // Financial Breakdown Table
  doc.setFillColor(...blue);doc.rect(0,y,210,8,'F');
  doc.setTextColor(255,255,255);doc.setFontSize(9);doc.setFont('helvetica','bold');
  doc.text('ADVANCE AMOUNT BREAKDOWN',14,y+5.5);
  y+=10;

  doc.autoTable({
    startY:y,
    head:[['Category','Expected Amount','Notes']],
    body:[
      ['Material Cost','₹ '+(fin?Number(fin.material_expected).toLocaleString('en-IN'):'__________'),''],
      ['Labour Cost','₹ '+(fin?Number(fin.labour_expected).toLocaleString('en-IN'):'__________'),''],
      ['Other Expenses','₹ '+(fin?Number(fin.other_expected).toLocaleString('en-IN'):'__________'),''],
      ['TOTAL ADVANCE','₹ '+(fin?Number((fin.material_expected||0)+(fin.labour_expected||0)+(fin.other_expected||0)).toLocaleString('en-IN'):'__________'),'']
    ],
    theme:'grid',
    headStyles:{fillColor:blue,fontSize:8},
    bodyStyles:{fontSize:9,minCellHeight:10},
    columnStyles:{1:{halign:'right',fontStyle:'bold'},2:{cellWidth:60}},
    didDrawRow:(data)=>{if(data.row.index===3){data.row.cells[0].styles.fontStyle='bold';data.row.cells[0].styles.fillColor=[239,246,255];}}
  });
  y=doc.lastAutoTable.finalY+8;

  // Contract & Profit
  if(fin){
    doc.setFontSize(8);doc.setTextColor(...gray);
    doc.text('Total Contract Value: ₹'+Number(fin.total_amount||0).toLocaleString('en-IN'),14,y);
    doc.text('GST Deduction ('+fin.gst_rate+'%): ₹'+Number((fin.total_amount||0)*(fin.gst_rate||18)/100).toLocaleString('en-IN'),14,y+5);
    doc.setTextColor(...darkBlue);doc.setFont('helvetica','bold');
    doc.text('Expected Profit: ₹'+Number(fin.expected_profit||0).toLocaleString('en-IN'),14,y+10);
    y+=18;
  }

  // Work Details
  if(j?.work_details){
    doc.setFillColor(248,250,252);doc.rect(14,y,182,3+(doc.splitTextToSize(j.work_details,170).length*4),'F');
    doc.setFontSize(7);doc.setFont('helvetica','normal');doc.setTextColor(...gray);doc.text('Scope of Work:',16,y+3.5);
    doc.setTextColor(30,41,59);doc.text(doc.splitTextToSize(j.work_details,170),16,y+8);
    y+=14+doc.splitTextToSize(j.work_details,170).length*4;
  }

  y+=6;

  // Approval Signatures
  doc.setFillColor(...blue);doc.rect(0,y,210,8,'F');
  doc.setTextColor(255,255,255);doc.setFontSize(9);doc.setFont('helvetica','bold');
  doc.text('APPROVALS',14,y+5.5);
  y+=12;

  const sigBoxes=[
    ['Prepared By','Field Manager / Scheduling Team'],
    ['Approved By (Manager/COO)','Signature with Date'],
    ['Approved By (Accounts/Admin)','Signature with Date']
  ];

  sigBoxes.forEach((box,i)=>{
    const x=14+(i%2===0?0:96);
    const bW=88;
    if(i===2){
      // Full width for accounts
      doc.setDrawColor(...gray);doc.setLineWidth(0.3);
      doc.rect(14,y,182,22);
      doc.setFontSize(8);doc.setFont('helvetica','bold');doc.setTextColor(...darkBlue);
      doc.text(box[0],16,y+5);
      doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(...gray);
      doc.text(box[1],16,y+9);
      doc.setDrawColor(200,210,220);doc.line(16,y+18,190,y+18);
      doc.text('Signature & Date',16,y+21);
      y+=26;
    } else {
      doc.setDrawColor(...gray);doc.setLineWidth(0.3);
      doc.rect(x,y,bW,22);
      doc.setFontSize(8);doc.setFont('helvetica','bold');doc.setTextColor(...darkBlue);
      doc.text(box[0],x+2,y+5);
      doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(...gray);
      doc.text(box[1],x+2,y+9);
      doc.setDrawColor(200,210,220);doc.line(x+2,y+18,x+bW-2,y+18);
      doc.text('Signature & Date',x+2,y+21);
      if(i===1)y+=26;
    }
  });

  // Footer
  doc.setFillColor(248,250,252);doc.rect(0,285,210,12,'F');
  doc.setFontSize(7);doc.setTextColor(...gray);
  doc.text('Handy Squad · Advance Request Form · Confidential',14,291);
  doc.text('Form generated: '+new Date().toLocaleString('en-IN'),196,291,{align:'right'});

  doc.save(`HSquad_Advance_${(j?.customer_name||'job').replace(/\s/g,'_')}.pdf`);
  showToast('Advance form downloaded!','success');
}
</script>
